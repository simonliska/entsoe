[project]
name = "entsoe-scraper"
version = "0.1.0"
description = "Config-driven AWS Lambda that scrapes ENTSO-E Transparency Platform data to S3 as CSV."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "boto3>=1.43.127",
    "moto[s3,ssm]>=5.2.5",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PT"]
ignore = ["S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
